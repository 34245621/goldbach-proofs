location = /goldbach {
    return 308 /goldbach/$is_args$args;
}

location = /goldbach/verified-imports.json {
    limit_except GET { deny all; }
    proxy_cache goldbach_imports;
    proxy_cache_key "verified-imports-gzip-v1";
    proxy_cache_valid 200 60s;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_pass https://jenkins-hook.goldbach.tech/verified-imports.json?;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host jenkins-hook.goldbach.tech;
    proxy_set_header Accept-Encoding "gzip";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    gunzip on;
}

location = /goldbach/submissions/upload {
    limit_except PUT { deny all; }
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_pass https://jenkins-hook.goldbach.tech/submissions/upload;
    proxy_set_header Host jenkins-hook.goldbach.tech;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
}

location ^~ /goldbach/ {
    location ~ ^/goldbach/(?:problems/[a-z-]+/)?api/(?:task|tasks|overview)$ {
        limit_except GET { deny all; }
        limit_req zone=goldbach_detail burst=10 nodelay;
        limit_req_dry_run on;
        limit_req_status 429;
        limit_req_log_level error;
        add_header Retry-After $goldbach_retry_after always;
        proxy_cache goldbach_reads;
        proxy_cache_key "$host$request_uri";
        proxy_cache_lock on;
        proxy_cache_lock_age 15s;
        proxy_cache_lock_timeout 15s;
        proxy_cache_use_stale updating;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_cache_valid 200 10s;
        proxy_ssl_server_name on;
        proxy_ssl_name www.movan.tech;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        add_header X-Goldbach-Read-Cache $upstream_cache_status;
        rewrite ^/goldbach(/.*)$ $1 break;
        proxy_pass https://127.0.0.1:8443;
    }

    location ~ ^/goldbach/(site\.js|site\.css|agent-icons\.svg|core-team-signup\.png|sponsor-settings\.css|sponsor-upload\.js|wechat\.svg|discussion-qr\.png|discussion\.js|presence\.js|goldbach-icon\.svg)$ {
        alias /opt/goldbach-web/$1;
        limit_except GET { deny all; }
        expires 5m;
        add_header X-Content-Type-Options nosniff;
    }

    location ~ "^/goldbach/sponsors/logo/[1-9][0-9]{0,15}\.png$" {
        limit_except GET { deny all; }
        proxy_cache goldbach_logos;
        proxy_cache_key "$uri:$goldbach_logo_format";
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_valid 200 30s;
        proxy_pass_request_headers off;
        proxy_set_header Host $host;
        proxy_set_header Accept $goldbach_logo_format;
        proxy_ssl_server_name on;
        proxy_ssl_name www.movan.tech;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        add_header X-Goldbach-Logo-Cache $upstream_cache_status;
        rewrite ^/goldbach(/.*)$ $1 break;
        proxy_pass https://127.0.0.1:8443;
    }

    client_max_body_size 256k;
    proxy_pass https://127.0.0.1:8443/;
    proxy_ssl_name www.movan.tech;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $host;
    proxy_set_header X-Goldbach-Client-IP $remote_addr;
}
